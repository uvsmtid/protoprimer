
[run]
source =
    src/metaprimer/main/
    src/protoprimer/main/

branch = true
data_file = .coverage
parallel = true
# FT_47_61_24_68.combined_coverage.md:
# Repo-relative paths in reports (the same across OS-es and checkouts):
relative_files = true

[paths]
# On `coverage combine`, paths matching the patterns (`*/src/`: any prefix, like `/work/src/` in a container) are rewritten to the first entry (`src/`: repo-relative):
source =
    src/
    */src/

[report]

include =
    src/metaprimer/main/*
    src/protoprimer/main/*

show_missing = true
skip_covered = false
fail_under = 80
