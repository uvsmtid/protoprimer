
[run]
source =
    src/metaprimer/main/
    src/protoprimer/main/

branch = true
data_file = .coverage
parallel = true
# Repo-relative paths in reports (the same across OS-es and checkouts):
relative_files = true

[paths]
# Map absolute paths (other worktrees, containers) to repo-relative ones on `coverage combine`:
source =
    src/
    */src/

[report]

include =
    src/metaprimer/main/*
    src/protoprimer/main/*

show_missing = true
skip_covered = false
fail_under = 80
