
repos:

    -   repo: https://github.com/pre-commit/pre-commit-hooks
        rev: v4.5.0  # Use the latest compatible version
        hooks:

        -   id: trailing-whitespace
            stages: [
                "pre-commit",
            ]

        -   id: end-of-file-fixer
            stages: [
                "pre-commit",
            ]

        -   id: mixed-line-ending
            args: [
                "--fix=lf",
            ]
            stages: [
                "pre-commit",
            ]

        -   id: check-executables-have-shebangs
            stages: [
                "pre-commit",
            ]

        -   id: check-json
            stages: [
                "pre-commit",
            ]

        -   id: check-yaml
            stages: [
                "pre-commit",
            ]

    -   repo: https://github.com/psf/black
        rev: 25.1.0
        hooks:
        -   id: black
            args: [
                # Use "unlimited" line:
                # Apply "Magic Comma", or "Trailing Comment", or "fmt: off"
                # to enforce line breaks in specific places.
                "--line-length", "999",
                "--force-exclude",
                "cmd/proto_code/proto_kernel.py",
            ]
            stages: [
                "pre-commit",
            ]

    -   repo: https://github.com/igorshubovych/markdownlint-cli
        rev: v0.45.0
        hooks:

        -   id: markdownlint
            args: [
                "--config",
                "gconf/markdownlint.yaml",
            ]
            stages: [
                "pre-commit",
            ]

    -   repo: https://github.com/codespell-project/codespell
        rev: v2.3.0
        hooks:
        -   id: codespell
            args: [
                "--ignore-words=gconf/codespell_ignore.txt",
            ]
            stages: [
                "pre-commit",
            ]

    -   repo: local
        hooks:
        -   id: shell-snippet-svg-lint
            name: shell_snippet.svg is pretty-printed
            entry: cmd/render_shell lint doc/_static/shell_snippet.svg
            language: system
            files: "^doc/_static/shell_snippet\\.svg$"
            pass_filenames: false
            stages: [
                "pre-commit",
            ]

        -   id: forbid-binary
            name: forbid binary files
            entry: "Binary files are not allowed:"
            language: fail
            types: [
                "binary",
            ]
            exclude: "^doc/_static/protoprimer\\.logo\\.16x16\\.png$"
            stages: [
                "pre-commit",
            ]

    -   repo: https://github.com/editorconfig-checker/editorconfig-checker.python
        rev: 3.0.3
        hooks:
        -   id: editorconfig-checker
            args: [
                # Allow existing violations in tons of files:
                "--disable-indentation",
                "--disable-indent-size",
                "--disable-max-line-length",
            ]
            stages: [
                "pre-commit",
            ]

    -   repo: https://github.com/gitleaks/gitleaks
        rev: v8.30.1
        hooks:
        -   id: gitleaks
            stages: [
                "pre-commit",
            ]
