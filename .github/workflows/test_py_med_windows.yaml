run-name: "${{ github.workflow }}: ${{ github.actor }}: ${{ github.event_name }}: ${{ github.ref_name }}: ${{ github.ref_type }}"
on:
    push:
        branches:
        -   "*"
    pull_request:
        branches:
        -   "*"
permissions:
    contents: read
# Cancel superseded runs per branch (never on `main`: every commit keeps its run):
concurrency:
    group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
    test_py_med_windows:
        # Same-repo PR-s are already covered by `push` (avoid running twice):
        if: >-
            github.event_name != 'pull_request'
            ||
            github.event.pull_request.head.repo.full_name != github.repository
        runs-on: windows-latest

        strategy:
            # When one of the jobs fails, this prevents canceling another job (for another Python version):
            fail-fast: false
            matrix:
                # FT_84_11_73_28.supported_python_versions.md:
                python-version:
                -   "3.11"
        steps:
            -   uses: actions/checkout@v4

            -   uses: ./.github/actions/test_env_windows
                with:
                    python-version: ${{ matrix.python-version }}
                    level: med
                    platform: windows
