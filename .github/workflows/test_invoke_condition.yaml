run-name: "${{ github.workflow }}: ${{ github.actor }}: ${{ github.event_name }}: ${{ github.ref_name }}: ${{ github.ref_type }}"
on:
    push:
        branches:
        -   "*"
    pull_request:
        branches:
        -   "*"
    schedule:
        # Keep running periodically to detect issues with newly released dependencies and images:
        # Every day at 18:00 SGT:
        -   cron: "0 10 * * *"
permissions:
    contents: read
# Cancel superseded runs per branch (never on `main`: every commit keeps its run):
concurrency:
    group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
    invoke_condition_scenarios:
        # Same-repo PR-s are already covered by `push` (avoid running twice):
        if: >-
            github.event_name != 'pull_request'
            ||
            github.event.pull_request.head.repo.full_name != github.repository
        runs-on: ubuntu-latest

        env:
            # FT_47_61_24_68.combined_coverage.md:
            # containers write coverage of the current code here:
            PROTOPRIMER_COVERAGE_DIR: ${{ github.workspace }}/tmp/coverage_data

        steps:
            -   run: "echo runner.os: ${{ runner.os }}"
            -   run: "echo github.repository: ${{ github.repository }}"
            -   run: "echo github.ref: ${{ github.ref }}"

            # The host `python` only runs the tests (scenarios run inside containers):
            -   uses: actions/setup-python@v5
                with:
                    python-version: "3.15"

            -   run: "python --version"
            -   run: "docker --version"

            -   uses: actions/checkout@v4

            -   uses: actions/cache@v4
                with:
                    path: |
                        ~/.cache/uv
                        ~/.cache/pip
                    key: deps-${{ runner.os }}-${{ hashFiles('dst/test_python_max_linux/version_constraints.txt') }}

            -   run: |
                    ${{ github.workspace }}/prime -vvv
                    ${{ github.workspace }}/cmd/prime_env -vvv

            -   name: ensure the env selector picked the env for this job
                run: |
                    test "$(readlink ${{ github.workspace }}/lconf)" = "dst/test_python_max_linux"

            # FT_64_09_03_66.invoke_condition.md:
            # These tests are skipped by default (not run by `CI=true` runs of `test_py_*` jobs):
            -   run: |
                    ${{ github.workspace }}/venv/bin/python -m pytest src/protoprimer/test/test_protoprimer/test_invoke_condition
                env:
                    TEST_PROTOPRIMER_INVOKE_CONDITION: "true"

            -   name: generate coverage (combine containers)
                # Even if some scenario failed: the data of the others is still valid:
                if: always() && github.event_name == 'push'
                run: |
                    ${{ github.workspace }}/venv/bin/python -m coverage combine --rcfile=${{ github.workspace }}/gconf/coveragerc.ini --data-file=${{ env.PROTOPRIMER_COVERAGE_DIR }}/.coverage ${{ env.PROTOPRIMER_COVERAGE_DIR }}
                    ${{ github.workspace }}/venv/bin/python -m coverage lcov --fail-under=0 --rcfile=${{ github.workspace }}/gconf/coveragerc.ini --data-file=${{ env.PROTOPRIMER_COVERAGE_DIR }}/.coverage -o ${{ github.workspace }}/coverage.lcov

            -   name: upload coverage (parallel)
                if: always() && github.event_name == 'push'
                uses: coverallsapp/github-action@v2
                with:
                    file: coverage.lcov
                    format: lcov
                    parallel: true
                    flag-name: ${{ github.job }}
                    build-number: ${{ github.sha }}

            -   run: "echo job.status: ${{ job.status }}"
