run-name: "${{ github.workflow }}: ${{ github.actor }}: ${{ github.event_name }}: ${{ github.ref_name }}: ${{ github.ref_type }}"
# TODO: TODO_29_67_72_68.combine_coverage_across_jobs.md: close the parallel `coveralls.io` build (`build-number` = commit).
# Every test workflow (`test_py_*`, `test_contract_compatibility`, `test_invoke_condition`) uploads its coverage as parallel
# (see `.github/actions/test_env_*`); this workflow waits until all of them are completed for the commit and closes the build.
# It is a plain `push` workflow (not `workflow_run`: that one only fires from the default branch) - so it works on any branch.
on:
    push:
        branches:
        -   "*"
permissions:
    actions: read
    contents: read
# Cancel superseded runs per branch (never on `main`: every commit keeps its run):
concurrency:
    group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
    finish_coverage:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            -   name: wait for all test workflows to complete for the commit
                env:
                    GH_TOKEN: ${{ github.token }}
                    SHA: ${{ github.sha }}
                    # Every workflow which uploads coverage as parallel:
                    EXPECTED: >-
                        test_py_min_linux
                        test_py_med_linux
                        test_py_max_linux
                        test_py_med_darwin
                        test_py_max_darwin
                        test_py_med_windows
                        test_py_max_windows
                        test_contract_compatibility
                        test_invoke_condition
                run: |
                    deadline=$(( $(date +%s) + 40 * 60 ))
                    while true; do
                        runs=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${SHA}&event=push&per_page=100")
                        ready=true
                        for name in ${EXPECTED}; do
                            # at least one run must exist (they may not be created yet) and all must be completed (re-runs included):
                            total=$(echo "${runs}" | jq "[.workflow_runs[] | select(.path == \".github/workflows/${name}.yaml\")] | length")
                            open=$(echo "${runs}" | jq "[.workflow_runs[] | select(.path == \".github/workflows/${name}.yaml\") | select(.status != \"completed\")] | length")
                            echo "${name}: total=${total} not_completed=${open}"
                            if [ "${total}" -lt 1 ] || [ "${open}" -ne 0 ]; then
                                ready=false
                            fi
                        done
                        if [ "${ready}" = "true" ]; then
                            break
                        fi
                        if [ "$(date +%s)" -ge "${deadline}" ]; then
                            echo "timed out waiting for the test workflows" >&2
                            exit 1
                        fi
                        sleep 30
                    done

            -   name: finish coveralls.io parallel build
                uses: coverallsapp/github-action@v2
                with:
                    parallel-finished: true
                    build-number: ${{ github.sha }}
