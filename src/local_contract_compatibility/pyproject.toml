[build-system]

requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local_contract_compatibility"
version = "0.0.0"

classifiers = [
    # This package is local and is never published:
    "Private :: Do Not Upload",
]

# FT_84_11_73_28.supported_python_versions.md:
requires-python = ">=3.7"

dependencies = [
    "tomli",
]

[tool.setuptools.packages.find]
where = ["./main"]

[tool.setuptools.package-dir]
local_contract_compatibility = "./main/local_contract_compatibility"
