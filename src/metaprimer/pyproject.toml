[build-system]

# TODO: FT_32_61_30_43.monorepo_support.md: use different `venv` for `metaprimer` with recent `setuptools` version:
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "metaprimer"
version = "0.3.0.dev1"
authors = [
    { name = "uvsmtid", email = "uvsmtid@gmail.com" },
]
description = "bootstrap beyond protoprimer"
readme = "readme.md"
# TODO: FT_32_61_30_43.monorepo_support.md: use different `venv` for `metaprimer` with recent `python` version:
# FT_84_11_73_28.supported_python_versions.md:
requires-python = ">=3.7"

# TODO: FT_32_61_30_43.monorepo_support.md: use different `venv` for `metaprimer` with no requirement to support EOL:
# FT_81_79_98_73.EOL_support.md: an instance of old/new mutually-exclusive dependency formats.
dynamic = ["license"]

keywords = [
]

classifiers = [
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "protoprimer",
]

[project.optional-dependencies]
extra = []

[project.urls]
Homepage = "https://github.com/uvsmtid/metaprimer"
Repository = "https://github.com/uvsmtid/metaprimer"

[tool]

[tool.setuptools.packages.find]
where = ["./main"]

[tool.setuptools.package-dir]
metaprimer = "./main/metaprimer"
