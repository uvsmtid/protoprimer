[build-system]

requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "protoprimer"
version = "0.14.0.dev1"

authors = [
    { name = "uvsmtid", email = "uvsmtid@gmail.com" },
]

# This is supposed to be synced with the `About` section on the `github.com` page:
# https://github.com/uvsmtid/protoprimer
description = "Escape the fragile mess of pre-venv shell scripts with a pure Python bootstrap script: 🚀 ⏩ single-touch, zero-args, self-contained, no-deps, cross-platform, testable init logic using standard tools to run apps in a custom environment isolated per repository"

readme = "readme.md"

# FT_84_11_73_28.supported_python_versions.md:
requires-python = ">=3.7"

# TODO: TODO_92_43_44_50.migrate_license_to_spdx.md:
# TODO: Use an SPDX string (the TOML table is deprecated by 2027-Feb-18).
license = { text = "MIT" }

keywords = [
    "venv",
    "virtualenv",
    "virtual environment",

    "env",
    "environment",

    "python",
    "pure python",

    "dev",
    "devops",
    "development",

    "boot",
    "bootstrap",
    "bootstrapper",

    "init",
    "initialize",
    "initializer",

    "check",
    "checker",

    "setup",
    "isolated",
    "repo",
]

classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Environment :: Console",
]

dependencies = []

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
    "freezegun",
]
extra = []

[project.urls]
Homepage = "https://github.com/uvsmtid/protoprimer"
Repository = "https://github.com/uvsmtid/protoprimer"
Documentation = "https://protoprimer.readthedocs.io"

[tool]

[tool.local_contract_compatibility]
baseline_commit_names = [
    "72649462",
]

[tool.setuptools.packages.find]
where = ["./main"]

[tool.setuptools.package-dir]
protoprimer = "./main/protoprimer"
