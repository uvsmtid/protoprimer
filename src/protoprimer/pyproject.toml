[build-system]

requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "protoprimer"
version = "0.14.1"

authors = [
    { name = "uvsmtid", email = "uvsmtid@gmail.com" },
]

# This is supposed to be synced with the `About` section on the `github.com` page:
# https://github.com/uvsmtid/protoprimer
description = "Escape the fragile mess of pre-venv shell scripts with a pure python bootstrapper: single-touch, zero-args, self-contained, no-deps, cross-platform, testable init logic using standard tools to run apps in a custom environment isolated per repository clone"

readme = { text = "See the [documentation](https://protoprimer.readthedocs.io).", content-type = "text/markdown" }

# FT_84_11_73_28.supported_python_versions.md:
requires-python = ">=3.7"

# TODO: TODO_92_43_44_50.migrate_license_to_spdx.md:
# TODO: Use an SPDX string (the TOML table is deprecated by 2027-Feb-18).
license = { text = "MIT" }

keywords = [
    "venv",
    "virtualenv",
    "virtual environment",

    "env",
    "environment",

    "python",
    "pure python",

    "dev",
    "devops",
    "development",

    "boot",
    "bootstrap",
    "bootstrapper",

    "init",
    "initialize",
    "initializer",

    "check",
    "checker",

    "setup",
    "isolated",
    "repo",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Software Distribution",
    "Topic :: Utilities",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    # FT_84_11_73_28.supported_python_versions.md: min:
    "Programming Language :: Python :: 3.7",
    # FT_84_11_73_28.supported_python_versions.md: max:
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    # TODO: TODO_50_98_96_87.support_windows.md:
    # "Operating System :: Microsoft :: Windows",
    "Natural Language :: English",
    "Environment :: Console",
]

dependencies = []

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
    "freezegun",
]
extra = []

[project.urls]
Homepage = "https://github.com/uvsmtid/protoprimer"
Repository = "https://github.com/uvsmtid/protoprimer"
Documentation = "https://protoprimer.readthedocs.io"

[tool]

[tool.local_contract_compatibility]
baseline_commit_names = [
    "47a3f83f29510baa881554d80250fb171ccc5aa8",
]

[tool.setuptools.packages.find]
where = ["./main"]

[tool.setuptools.package-dir]
protoprimer = "./main/protoprimer"
