[build-system]

requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "protoprimer"
version = "0.14.1"

authors = [
    { name = "uvsmtid", email = "uvsmtid@gmail.com" },
]

# This is supposed to be synced with the `About` section on the `github.com` page:
# https://github.com/uvsmtid/protoprimer
description = "▶️ prime your repo clone to run"

readme = { text = "See the [documentation](https://protoprimer.readthedocs.io).", content-type = "text/markdown" }

# FT_84_11_73_28.supported_python_versions.md:
requires-python = ">=3.7"

# FT_81_79_98_73.EOL_support.md: an instance of old/new mutually-exclusive dependency formats.
dynamic = ["license"]

keywords = [
    "venv",
    "virtualenv",
    "virtual environment",

    "env",
    "environment",

    "python",
    "pure python",

    "dev",
    "devops",
    "development",

    "boot",
    "bootstrap",
    "bootstrapper",

    "init",
    "initialize",
    "initializer",

    "check",
    "checker",

    "setup",
    "isolated",
    "repo",
    "clone",
    "repo clone",

    "prime",
    "primer",

    "shell",
    "shell script",
    "pre-venv",

    "single-touch",
    "zero-arguments",
    "self-contained",
    "no-dependencies",
    "cross-platform",
    "well-tested",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Software Distribution",
    "Topic :: Utilities",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    # FT_84_11_73_28.supported_python_versions.md: min:
    "Programming Language :: Python :: 3.7",
    # FT_84_11_73_28.supported_python_versions.md: med:
    "Programming Language :: Python :: 3.11",
    # FT_84_11_73_28.supported_python_versions.md: max:
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    # TODO: TODO_50_98_96_87.support_windows.md:
    # "Operating System :: Microsoft :: Windows",
    "Natural Language :: English",
    "Environment :: Console",
]

dependencies = []

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
    "freezegun",
]
extra = []

[project.urls]
Homepage = "https://github.com/uvsmtid/protoprimer"
Repository = "https://github.com/uvsmtid/protoprimer"
Documentation = "https://protoprimer.readthedocs.io"

[tool]

[tool.local_contract_compatibility]
baseline_commit_names = [
    "protoprimer-v0.14.0.final",
]

[tool.setuptools.packages.find]
where = ["./main"]

[tool.setuptools.package-dir]
protoprimer = "./main/protoprimer"
